$fg = 235, 219, 178
$bg = 6, 6, 6
$border_active = 211, 134, 155
$border_inactive = 102, 92, 84
$almost_black = 40, 40, 38
$accent = 184, 126, 64
$highlight = 215, 196, 131

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 10
    brightness = 0.6
    contrast = 0.9
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_family = RainWorldSymbols
    font_color = rgb($highlight)
    fade_on_empty = false
    rounding = -1
    check_color = rgb($accent)
    placeholder_text = <i><span foreground="##928374">n i x o s</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgba($fg, 0.75)
  font_size = 144
  font_family = JetBrains Mono Extrabold
  position = 0, 136
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A - %B %d")"
  color = rgba($highlight, 0.75)
  font_size = 24
  font_family = JetBrains Mono
  position = 0, 288
  halign = center
  valign = center
}

